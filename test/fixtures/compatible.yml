# /test/fixtures/compatible.yml
name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CI: "true"
defaults:
  run:
    shell: bash
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Check lint
        run: npm run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - run: npm run typecheck
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - run: npm run format:check
